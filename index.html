<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }

        h1 {
            color: darkgreen;
        }

        canvas {
            background-color: white;
            border: 3px solid black;
        }

        .scoreboard {
            font-size: 18px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: darkgreen;
            color: white;
        }

        button:hover {
            background-color: green;
        }

        #message {
            font-size: 22px;
            font-weight: bold;
            color: red;
        }

    </style>

</head>

<body>

    <h1> Snake Game</h1>

    <div class="scoreboard">

        <p id="score">Score: 0</p>

        <p id="highScore">High Score: 0</p>

    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <p id="message"></p>

    <button onclick="togglePause()">Pause / Resume</button>

    <button onclick="restartGame()">Restart</button>

    <p>Use the arrow keys to control the snake.</p>

    <script>


        // =========================
        // GAME SETUP
        // =========================

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;


        // =========================
        // GAME VARIABLES
        // =========================

        let snake;
        let direction;
        let food;
        let score = 0;
        let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
        let gameOver = false;
        let paused = false;
        let canChangeDirection = true;
        let gameInterval;
        let speed = 200;


        // =========================
        // INITIALIZE GAME
        // =========================

        function initializeGame() {

            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            direction = { x: 1, y: 0 };
            score = 0;
            speed = 200;
            gameOver = false;
            paused = false;
            canChangeDirection = true;
            generateFood();
            updateScore();
            updateHighScore();
            document.getElementById("message").textContent = "";
            drawGame();
        }


        // =========================
        // DRAW GAME
        // =========================

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw food

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize,
                gridSize
            );


            // Draw snake

            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "darkgreen" : "limegreen";
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize,
                    gridSize
                );

                ctx.strokeStyle = "black";
                ctx.strokeRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize,
                    gridSize
                );

            });

        }


        // =========================
        // KEYBOARD CONTROLS
        // =========================

        document.addEventListener("keydown", function(event) {

            if (gameOver || paused || !canChangeDirection) return;
            let newDirection = null;
            switch (event.key) {

                case "ArrowUp":
                    newDirection = { x: 0, y: -1 };
                    break;

                case "ArrowDown":
                    newDirection = { x: 0, y: 1 };
                    break;

                case "ArrowLeft":
                    newDirection = { x: -1, y: 0 };
                    break;

                case "ArrowRight":
                    newDirection = { x: 1, y: 0 };
                    break;

            }

            if (newDirection) {
                event.preventDefault();

                if (
                    newDirection.x !== -direction.x ||
                    newDirection.y !== -direction.y
                ) {

                    direction = newDirection;
                    canChangeDirection = false;
                }
            }
        });


        // =========================
        // GENERATE FOOD
        // =========================

        function generateFood() {
            let newFood;

            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

            } while (
                snake.some(segment =>
                    segment.x === newFood.x &&
                    segment.y === newFood.y
                )
            );
            food = newFood;
        }


        // =========================
        // UPDATE SCORE
        // =========================

        function updateScore() {

            document.getElementById("score").textContent =
                "Score: " + score;

        }


        // =========================
        // UPDATE HIGH SCORE
        // =========================

        function updateHighScore() {
            document.getElementById("highScore").textContent =
                "High Score: " + highScore;
        }


        // =========================
        // GAME OVER
        // =========================

        function endGame() {
            gameOver = true;
            clearInterval(gameInterval);
            document.getElementById("message").textContent =
                "GAME OVER! Final Score: " + score;
        }


        // =========================
        // UPDATE GAME
        // =========================

        function updateGame() {
            if (gameOver || paused) return;
            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };


            // Check if food is eaten

            const eatingFood =
                newHead.x === food.x &&
                newHead.y === food.y;


            // Check wall collision

            if (
                newHead.x < 0 ||
                newHead.x >= tileCount ||
                newHead.y < 0 ||
                newHead.y >= tileCount
            ) {

                endGame();

                return;

            }


            // Check body collision

            const bodyToCheck = eatingFood
                ? snake
                : snake.slice(0, -1);

            const hitBody = bodyToCheck.some(segment =>
                segment.x === newHead.x &&
                segment.y === newHead.y
            );

            if (hitBody) {
                endGame();
                return;
            }


            // Move snake

            snake.unshift(newHead);


            // Eating food

            if (eatingFood) {
                score += 10;
                updateScore();
                generateFood();


                // Update high score

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    updateHighScore();
                }


                // Increase speed

                if (speed > 70) {
                    speed -= 10;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(updateGame, speed);
                }
            } else {
                snake.pop();
            }

            canChangeDirection = true;
            drawGame();
        }


        // =========================
        // PAUSE AND RESUME
        // =========================

        function togglePause() {
            if (gameOver) return;
            paused = !paused;
            if (paused) {
                document.getElementById("message").textContent =
                    "GAME PAUSED";
            } else {
                document.getElementById("message").textContent = "";
            }
        }


        // =========================
        // RESTART GAME
        // =========================

        function restartGame() {
            clearInterval(gameInterval);
            initializeGame();
            gameInterval = setInterval(updateGame, speed);
        }


        // =========================
        // START GAME
        // =========================

        initializeGame();
        gameInterval = setInterval(updateGame, speed);

    </script>

</body>

</html>

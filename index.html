<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        canvas {
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <h1>Snake Game</h1>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <p id="info">Snake is moving!</p>

    <script>

        // GAME SETUP

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;


        // INITIAL STATE

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];

        let direction = { x: 1, y: 0 };

        let food = { x: 15, y: 15 };

        let score = 0;


        // DRAW GAME

        function drawGame() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw food

            ctx.fillStyle = "red";

            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize,
                gridSize
            );

            // Draw snake

            ctx.fillStyle = "black";

            for (const segment of snake) {

                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize,
                    gridSize
                );

            }

        }


        // MOVE SNAKE

        function updateGame() {

            const head = snake[0];

            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };

            snake.unshift(newHead);

            snake.pop();

            drawGame();

        }


        // GAME LOOP

        drawGame();

        setInterval(updateGame, 200);

    </script>

</body>
</html>

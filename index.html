<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        canvas {
            border: 2px solid black;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }

        #gameOver {
            color: red;
            font-size: 24px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <h1>Snake Game</h1>

    <h3 id="score">Score: 0</h3>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <p id="gameOver"></p>

    <button onclick="restartGame()">Restart Game</button>

    <p>Use arrow keys to control the snake.</p>

    <script>

        // GAME SETUP

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake;
        let direction;
        let food;
        let score;
        let gameOver;
        let canChangeDirection;

        let gameInterval;


        // INITIALIZE GAME

        function initializeGame() {

            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            direction = { x: 1, y: 0 };

            food = { x: 15, y: 15 };

            score = 0;

            gameOver = false;

            canChangeDirection = true;

            document.getElementById("gameOver").textContent = "";

            updateScore();

            drawGame();

        }


        // DRAW GAME

        function drawGame() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw food

            ctx.fillStyle = "red";

            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize,
                gridSize
            );

            // Draw snake

            ctx.fillStyle = "black";

            for (const segment of snake) {

                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize,
                    gridSize
                );

            }

        }


        // KEYBOARD CONTROLS

        document.addEventListener("keydown", function(event) {

            if (gameOver || !canChangeDirection) return;

            let newDirection = null;

            if (event.key === "ArrowUp") {
                newDirection = { x: 0, y: -1 };
            }

            else if (event.key === "ArrowDown") {
                newDirection = { x: 0, y: 1 };
            }

            else if (event.key === "ArrowLeft") {
                newDirection = { x: -1, y: 0 };
            }

            else if (event.key === "ArrowRight") {
                newDirection = { x: 1, y: 0 };
            }

            if (newDirection) {

                event.preventDefault();

                if (
                    newDirection.x !== -direction.x ||
                    newDirection.y !== -direction.y
                ) {

                    direction = newDirection;

                    canChangeDirection = false;

                }

            }

        });


        // GENERATE FOOD

        function generateFood() {

            let newFood;

            do {

                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };

            } while (
                snake.some(segment =>
                    segment.x === newFood.x &&
                    segment.y === newFood.y
                )
            );

            food = newFood;

        }


        // UPDATE SCORE

        function updateScore() {

            document.getElementById("score").textContent =
                "Score: " + score;

        }


        // GAME OVER

        function endGame() {

            gameOver = true;

            clearInterval(gameInterval);

            document.getElementById("gameOver").textContent =
                "GAME OVER! Your score: " + score;

        }


        // MOVE SNAKE

        function updateGame() {

            if (gameOver) return;

            const head = snake[0];

            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };

            // Check food

            const eatingFood =
                newHead.x === food.x &&
                newHead.y === food.y;

            // Check wall collision

            if (
                newHead.x < 0 ||
                newHead.x >= tileCount ||
                newHead.y < 0 ||
                newHead.y >= tileCount
            ) {

                endGame();

                return;

            }

            // Check body collision

            const bodyToCheck = eatingFood
                ? snake
                : snake.slice(0, -1);

            const hitBody = bodyToCheck.some(segment =>
                segment.x === newHead.x &&
                segment.y === newHead.y
            );

            if (hitBody) {

                endGame();

                return;

            }

            // Move snake

            snake.unshift(newHead);

            if (eatingFood) {

                score += 10;

                updateScore();

                generateFood();

            } else {

                snake.pop();

            }

            canChangeDirection = true;

            drawGame();

        }


        // RESTART GAME

        function restartGame() {

            clearInterval(gameInterval);

            initializeGame();

            gameInterval = setInterval(updateGame, 200);

        }


        // START GAME

        initializeGame();

        gameInterval = setInterval(updateGame, 200);

    </script>

</body>
</html>
